version: v2
inputs:
  - directory: proto
plugins:
  # Python: remote plugin generates hermes_bridge_pb2.py (runtime).
  # PINNED to v33.5: gencode stamped by this protoc (6.33.5) must be <= the
  # protobuf runtime inside the Hermes gateway container (6.33.5). Unpinned
  # "latest" drifted to v35.x gencode and the plugin silently failed to load.
  - remote: buf.build/protocolbuffers/python:v33.5
    out: src/byoa_plugin/proto_gen

  # Python: typed stubs via mypy-protobuf (installed in plugin/.venv).
  # Generates hermes_bridge_pb2.pyi alongside the runtime module.
  - local: protoc-gen-mypy
    out: src/byoa_plugin/proto_gen

  # TypeScript: ts-proto (installed in glasses-app/node_modules).
  # Produces hermes_bridge.ts with idiomatic types + oneof helpers.
  - local: protoc-gen-ts_proto
    out: ../glasses-app/src/proto_gen
